name: Release

# ══════════════════════════════════════════════════════════════════════════
# 🔴 这个 workflow 的**文件名就是签名身份的一部分**。
#
#   02-registry.md §8：
#     release   身份 = https://github.com/geoly-ai/skills-hub/.github/workflows/release.yml@refs/heads/main
#     timestamp 身份 = https://github.com/geoly-ai/skills-hub/.github/workflows/timestamp.yml@refs/heads/main
#
#   两个身份**不可互换**，CLI 分别精确比对（src/snapshot.mjs 的 RELEASE_IDENTITY /
#   TIMESTAMP_IDENTITY，`===` 比较，不做前缀匹配、不做通配）。
#   timestamp 签名者拥有「指向哪张已签快照」的高权限，所以它必须是**单独的文件、
#   单独的最小权限**。🔴 **绝不能把 timestamp.yml 并进这里** —— 合并即等于
#   让一个身份同时拥有两种权力，而 CLI 那一侧的区分就变成了摆设。
#
# 🔴 只能从 `main` 触发。keyless 证书的 SAN 里带的是**触发时的 ref**：
#    从 tag 触发会签出 `…release.yml@refs/tags/vX`，与上面钉死的身份不同，
#    CLI 必拒。所以 guard job 第一件事就是断言 ref。
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只走到自验为止，不 publish（第一次用这个）"
        type: boolean
        default: true
      registry_only:
        # 🔴 registry 的分发**不该被 npm 发布绑架**。
        #    快照是独立演进的（promote.yml 推一张新快照，与 CLI 版本无关），
        #    而 `release-assets` 原本 `needs: publish` —— 于是「推一张新快照」
        #    变成了「必须升一次 CLI 版本号」，纯属人为耦合。
        #    2026-09-03 实测踩到：0.3.0 发布时 npm 回查差 1 分钟超时，
        #    publish job 红 → `hub-v2` 整个被跳过，而**包其实已经发出去了**，
        #    于是既补不了资产、又不能重跑（版本号已被占）。
        description: "只发 registry（hub-v<N> 快照+资产），跳过 npm publish 与 CLI Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── ① 前置断言：ref、元数据、打包内容 ──────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      version: ${{ steps.meta.outputs.version }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: 🔴 只允许从 main 发布
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::从 $GITHUB_REF 触发。keyless 证书的 SAN 会变成 …release.yml@$GITHUB_REF，"
            echo "::error::与 02-registry.md §8 钉死的 @refs/heads/main 不同 —— 签出来的东西 CLI 一定验不过。"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 checkout 默认会把 GITHUB_TOKEN 写进 .git/config。
          #    这个 job 之后要跑第三方代码（npm ci），不给它留一个能推仓库的凭据。
          persist-credentials: false
          # E-2 的前提：attestation 里 workflowRef 钉的 sha 必须等于 sourceCommit，
          # 而两者都取 github.sha —— 所以这里必须确实检出 github.sha 那一版。
          ref: ${{ github.sha }}

      - name: 🔴 检出的确实是 github.sha
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::HEAD=$head 与 GITHUB_SHA=$GITHUB_SHA 不一致 —— E-2 的绑定会断链"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - run: node scripts/check-node-matrix.mjs

      - run: npm ci --ignore-scripts
      # 🔴 发布路径上尤其要先过这一道：签名身份写错的话，
      #    下面 publish job 里的「自验」会用同一个错值去验，照样绿。
      - run: node --no-warnings scripts/check-signing-identities.mjs

      - id: read
        run: echo "matrix=$(jq -c . scripts/node-versions.json)" >> "$GITHUB_OUTPUT"

      # 发布元数据门。这道门**只在发布路径上**跑：仓库长期是 private: true 的开发态，
      # 放进 CI 会让主干长红，而长红的门几周内就会被人加上 continue-on-error。
      #
      # 🔴 但 dry_run 时它只报告、不阻断 —— 理由很具体：
      #    dry_run 的**全部意义**是在元数据定稿之前先把签发链跑通
      #    （尤其是 R-6 那个会自己爆炸的 cosign / Rekor 版本问题）。
      #    如果 private: true 在这里就把 dry_run 拦死，canary 永远跑不到，
      #    于是「先验证签发链」这条路根本不存在。
      #    真正要发的那一次（dry_run=false）走的是上面那个硬门。
      - name: 发布元数据门（真发布 —— 硬门）
        if: ${{ inputs.dry_run == false }}
        run: node scripts/publish-check.mjs
      - name: 发布元数据门（dry_run —— 只报告，不阻断）
        if: ${{ inputs.dry_run != false }}
        run: |
          node scripts/publish-check.mjs || \
            echo "::warning::publish-check 未通过；dry_run 不阻断，真发布时它是硬门。"

      # 判据是 npm pack 的**真实清单**，不是 package.json 的 files 声明。
      # 具体防的是 src/trust-roots/ 漏出包外 —— 那等于用户机器上的验签器没根可用。
      - run: node scripts/check-pack-contents.mjs

      - id: meta
        run: |
          {
            echo "version=$(jq -r .version package.json)"
            echo "name=$(jq -r .name package.json)"
          } >> "$GITHUB_OUTPUT"

      # 🔴 **版本没占用过 —— 必须在任何不可逆动作之前查。**
      #
      #    `publish-check.mjs` 查的是 package.json 的元数据形状，**不查 npm 上
      #    有没有这个版本**（它也不该查：那道门在本地也会被人手跑，不能依赖网络）。
      #    而 release.yml 里签名排在发布**前面**：
      #      打包 → Sigstore 签名（写 Rekor）→ 自验 → 签快照 → attestation → 发布
      #    版本忘了 bump 的话，前面那一串**已经在公开的透明日志上留下永久条目**，
      #    最后才在 npm 那里因为「版本已存在」失败 —— 白烧一串不可逆动作。
      #
      #    ⚠️ 放在 guard 里（这个 job 没有 OIDC、没有写权限），比 publish job 里的
      #    canary 还早一步。
      - name: 🔴 版本在 npm 上必须还空着（真发布是硬门）
        # registry_only 不发 npm，版本占没占用与它无关 —— 这一门对它没有意义。
        if: ${{ inputs.registry_only == false }}
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # `npm view <pkg>@<ver> version` 命中则输出版本号，未命中则输出为空。
          # ⚠️ 包整个不存在时 npm 会以非零退出 —— 那是**合法**的（首发），
          #    所以这里区分「命令失败」与「查到了」，不能一律当成占用。
          got=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ -n "$got" ]; then
            msg="$NAME@$VERSION 在 npm 上已经存在 —— 请先 bump 版本。"
            if [ "$DRY" = "false" ]; then
              echo "::error::$msg"
              echo "::error::  🔴 拦在这里是有意的：再往下走会先签名、写 Rekor（永久且公开），"
              echo "::error::     最后才在 npm 那一步失败。"
              exit 1
            fi
            echo "::warning::$msg（dry_run 不阻断）"
          else
            echo "::notice::$NAME@$VERSION 在 npm 上还空着 ✅"
          fi

  # ── ② 全量测试（与 CI 同一份矩阵） ─────────────────────────────────────
  # 🔴 这个 job **没有任何 write 权限**，也不碰 OIDC。
  #    Codex 评审点：别在持有 id-token / contents:write 的 job 里跑测试 ——
  #    测试会执行仓库里与依赖里的任意代码，那些代码不该有机会看见发布凭据。
  test:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: node --test test/*.test.mjs

  # ── ③ 签名 + 自验 + 发布 ───────────────────────────────────────────────
  publish:
    needs: [guard, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      # OIDC：Sigstore keyless 与 npm provenance 都靠它，没有任何长期密钥。
      id-token: write
      # 🔴 **不给 contents: write**。往 GitHub Release 传资产是下一个 job 的事，
      #    那个 job 不碰 OIDC。两种权力不放在同一个 job 里。
      contents: read
    outputs:
      tgz: ${{ steps.pack.outputs.tgz }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      snapshot_n: ${{ steps.assets.outputs.snapshot_n }}
      snapshot_sha256: ${{ steps.assets.outputs.snapshot_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm trusted publishing 需要 npm ≥ 11.5.1；用最新 LTS 自带的 npm，
          # 别用最低支持版本那一档带的旧 npm。
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - name: 装 cosign（版本钉死）
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # 🔴 不用 latest。docs/m1/01-residual-risks.md R-6：
          #    我们的 assertTLogBodyShape() 只认 hashedrekord **0.0.1**。
          #    Rekor v2 的 hashedRekordV002 会被直接拒（E_TLOG_BODY_VERSION）。
          #
          # ⚠️ **这个版本号是个待定值，不是已验证值。**
          #    cosign 当前最新是 v3.x（2026-08-27 查），而 v3 很可能已经跟着上游
          #    默认走 Rekor v2 —— 那正是 R-6 会咬人的地方。所以这里先钉在 v2 的
          #    最后一档；但「v2.4.3 签出来的 bundle 我们的验签器一定收」这件事
          #    **本机无从证明**（要真的在 GitHub Actions 上签一次才知道）。
          #    🔴 因此第一次跑 release 必须用 `dry_run: true`：
          #    canary 步骤会在任何不可逆动作之前把这个问题暴露出来，
          #    然后按真实结果把这个版本号定死。
          cosign-release: v2.4.3

      # ── 🔴 canary：先签一个**扔掉的**小文件，用我们自己的验签器验一遍 ──
      #
      # 为什么必须在 publish **之前**：R-6 那条会自己爆炸。上游把 Rekor 切到 v2
      # 的那天，签出来的 bundle 会突然验不过 —— 如果那时候已经 publish 了，
      # 用户拿到的就是一个「发布了但验不了」的版本。
      # 这一步把那个失败提前到**任何不可逆动作之前**。
      - name: canary —— 签发链自检（在任何不可逆动作之前）
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          echo "geoly skills-hub release canary $GITHUB_SHA" > canary.txt
          cosign sign-blob \
            --new-bundle-format \
            --rekor-url https://rekor.sigstore.dev \
            --bundle canary.sigstore.json \
            canary.txt
          # 🔴 用**安装链路同一条代码路径**验：createSigstoreVerifier() +
          #    loadBuiltinTrustedRoot()，身份取 src/snapshot.mjs 的 RELEASE_IDENTITY。
          node --no-warnings scripts/release/verify-own-bundle.mjs \
            --artifact canary.txt --bundle canary.sigstore.json --identity release
          rm -f canary.txt canary.sigstore.json

      # ── 打包一次，之后**只用这一份字节** ──────────────────────────────
      # 🔴 不要「npm pack 一次、npm publish 再打一次」：那样签的 tarball 与发出去的
      #    tarball 不保证逐字节相同，而摘要正是身份。publish 显式吃这个 .tgz。
      - name: 打包（这份字节既拿去签，也拿去发）
        id: pack
        run: |
          set -euo pipefail
          tgz=$(npm pack --silent)
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -l "$tgz"

      - name: Sigstore keyless 签名（messageSignature 形态）
        env:
          COSIGN_YES: "true"
          # 🔴 表达式一律先落成环境变量，**不直接插进 run 的脚本正文**。
          #    `${{ … }}` 是在 shell 之前做文本替换的：值里带一个引号或分号，
          #    插出来的就是另一条命令。这里的值来自 package.json，看着可控，
          #    但「看着可控」不是判据 —— 判据是它有没有机会变成脚本。
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          # --new-bundle-format 产出的是 Sigstore bundle（protobuf JSON）。
          # 🔴 形态必须是 messageSignature：src/sigstore.mjs 的 assertMessageSignature()
          #    明确**拒绝 dsseEnvelope** —— DSSE 的签名验的是 envelope 自己的 PAE，
          #    与我们手上的字节没有绑定关系。sign-blob 走的正是 messageSignature。
          cosign sign-blob \
            --new-bundle-format \
            --rekor-url https://rekor.sigstore.dev \
            --bundle "$TGZ.sigstore.json" \
            "$TGZ"

      - name: 🔴 自验：我们自己的 CLI 能不能验过我们自己签的东西
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          node --no-warnings scripts/release/verify-own-bundle.mjs \
            --artifact "$TGZ" \
            --bundle "$TGZ.sigstore.json" \
            --identity release

      # ── 签快照（02-registry.md §1 的第一个签名对象）──────────────────────
      # 🔴 §1 定了**三个**签名对象：snapshots/hub-<N>.json（release 身份）、
      #    timestamp.json（timestamp 独立身份）、attestation（release 身份）。
      #    timestamp.yml 签第二个，下面那步出第三个 —— 而**第一个一直没人签**。
      #    CLI 的 fetchSnapshot() 要的正是 `<N>.sigstore.json`，没有它整条读取路径
      #    根本起不来。这一步补的就是那一段。
      #
      # 🔴 **只签还没有 bundle 的那些。** 快照是只增不改的（01-artifacts.md §1），
      #    重签一张已签过的会产出一份**不同字节**的 bundle（Rekor 条目、时间都不同），
      #    于是同一张快照在不同轮次有两个签名 —— 而「只增不改」正是它的立身之本。
      # ── §1 阶段 C：用同一脚本重建资产，断言字节与快照记录一致 ──────────
      # 🔴 这一步和 validate-promotion 的复算**不是**一回事：那个跑在 promotion PR
      #    上、重算整张快照；这个跑在 **merge 之后**，判的是「我这一刻从 artifacts/
      #    打出来的字节，与那张即将被签的快照记录的摘要一致」。
      #    中间隔着一次 merge —— 合并顺序、rebase、一次「顺手改 typo」的追加提交，
      #    都会让 main 上的树与被验过的那棵不同。
      #
      # 🔴🔴 **位置：必须在签名与 npm publish 之前。**
      #    早先我把它放在最后，于是失败时快照已经被签、attestation 已经生成、
      #    npm 也已经发出去 —— 那三样都**撤不回来**（Codex 2026-08-31）。
      #    这一步只读、只算，放在最前面没有代价。
      #
      # ⚠️ 挑哪张快照由脚本自己用 `newestSnapshot()` 决定，**不在 shell 里挑**：
      #    shell 版接受 `hub-01.json` / `hub-1e3.json`、不查编号重复、
      #    也不比对文件名与内容里的 snapshot。
      - name: 重建制品资产并比对（§1 阶段 C）
        id: assets
        run: |
          set -euo pipefail
          node --no-warnings scripts/release/build-release-assets.mjs \
            --artifacts artifacts \
            --snapshots-dir registry/snapshots \
            --out dist/assets > assets.out
          cat assets.out
          # 🔴 把「用了哪一张快照、它的摘要是多少」传给下游 —— 下游 job 拿它当
          #    **真值**去复核，而不是相信跨 job 传过来的那份快照没被动过。
          cat assets.out >> "$GITHUB_OUTPUT"

      - name: 签快照（无快照则跳过）
        env:
          COSIGN_YES: "true"
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # 🔴 **直接迭代 glob，不要中间数组。** `set -u` 下 `"${arr[@]}"` 在数组为空时
          #    会报 `unbound variable`（bash 4.3 及更早，以及 macOS 自带的 3.2）。
          #    GitHub 的 runner 现在是 bash 5.x、容忍这一条 —— 但那是「换个 runner 就红」
          #    的依赖，不值得为省一个变量而背上。
          shopt -s nullglob
          signed=0
          for f in registry/snapshots/hub-*.json; do
            # 🔴 把 bundle 自己剔掉 —— 它叫 `hub-42.json.sigstore.json`（仓库的约定是
            #    **追加**，同 `$TGZ.sigstore.json` 与 `registry/timestamp.json.sigstore.json`），
            #    而那个名字本身就匹配 `hub-*.json`。不剔就会去签一份签名。
            [ "${f%.sigstore.json}" = "$f" ] || continue
            if [ -f "$f.sigstore.json" ]; then
              # 🔴 **已有 bundle 要真的验一遍，不能只看文件在不在。**
              #    一份损坏 / 陈旧 / 用错身份签的 bundle 同样满足 `-f`，然后会被
              #    原样挂到 Release 上 —— 那是一个「看起来可验签」的分发物。
              #    🔴 验不过就**硬失败**，不重签：重签会把一次真实的完整性事件
              #    悄悄抹平成一次正常发布。
              echo "::notice::$f 已经有 bundle —— 复验它（不重签：快照只增不改）"
              node --no-warnings scripts/release/verify-own-bundle.mjs \
                --artifact "$f" --bundle "$f.sigstore.json" --identity release
              continue
            fi
            # 🔴 dry_run 下**不签真快照**。cosign 会把条目写进 Rekor 公共透明日志，
            #    那是**不可撤销的公开记录**；而 dry_run 产出的 bundle 既不会进 Release
            #    也不会进仓库，等于留下一条「这张快照发布过」的假痕迹。
            #    签发链本身已经由上面的 canary 步骤验过了（同一个 cosign、同一个身份）。
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::dry_run：跳过对 $f 的真实签名（不往 Rekor 写不可撤销的条目）"
              continue
            fi
            signed=$((signed + 1))
            echo "── 签 $f"
            cosign sign-blob \
              --new-bundle-format \
              --rekor-url https://rekor.sigstore.dev \
              --bundle "$f.sigstore.json" \
              "$f"
            # 🔴 自验：我们自己的验签器必须收自己签出来的东西，且身份是 **release**
            node --no-warnings scripts/release/verify-own-bundle.mjs \
              --artifact "$f" --bundle "$f.sigstore.json" --identity release
            # 🔴 交叉证伪：拿 **timestamp 身份** 去验**必须失败，且必须是因为身份不匹配**。
            #    §1 要求两个身份不可互换；只证「release 身份能验过」在「身份判定退化成
            #    恒真」时也成立。只判非零退出同样不够 —— 文件不存在、验签器坏了也非零。
            node --no-warnings scripts/release/verify-own-bundle.mjs \
              --artifact "$f" --bundle "$f.sigstore.json" \
              --identity timestamp --expect-failure E_IDENTITY_MISMATCH
          done
          if [ "$signed" -eq 0 ]; then
            echo "::notice::没有待签的快照（registry/snapshots/ 为空，或都已经有 bundle）。"
          fi

      # ── attestation（02-registry.md §1.1）───────────────────────────────
      # 🔴 只在**快照存在**时才做。现在仓库里没有 registry/snapshots/，
      #    所以这一步会被跳过 —— 如实跳过，不造一个假的 subject 出来凑。
      #    attestation 绑的是**快照**的 sha256，拿 npm tarball 去冒充快照，
      #    就是把「制品签发链已闭合」这件还没发生的事写成已发生。
      - name: attestation（无快照则跳过）
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # 🔴 **必须把 bundle 从候选里剔掉。** 它叫 `hub-42.json.sigstore.json`，
          #    既匹配 `hub-*.json`，又在 `sort -V` 里排在 `hub-42.json` **后面** ——
          #    `tail -1` 会选中它，于是 attestation 去签了一份**签名**而不是快照，
          #    而 subject 的名字看起来还挺像回事。
          #    （这是「签快照」那一步引入的回归：在此之前目录里根本没有 .sigstore.json。）
          # ⚠️ 顺带：glob 展开是**字典序**，而快照号是 `hub-<N>` —— `hub-10` 会排在
          #    `hub-2` 前面。所以按**数字**取最大，不靠 glob 顺序、也不靠 `sort -V`。
          # 🔴 **这里不能用 `case … in *.sigstore.json) … ;; esac`。**
          #    bash 3.2 在 `$( )` 里解析 `case` 的模式收尾 `)` 时会把它当成命令替换
          #    的结尾 —— 报 `syntax error near unexpected token ';;'`（本机实测）。
          #    runner 现在是 bash 5.x 不会踩，但这是发布关键路径，不值得赌 bash 版本。
          #    `[ "${f%.sigstore.json}" = "$f" ]` 只用参数展开，哪个 shell 都一样。
          shopt -s nullglob
          newest=$(for f in registry/snapshots/hub-*.json; do
                     [ "${f%.sigstore.json}" = "$f" ] || continue
                     n=${f##*/hub-}; echo "${n%.json} $f"
                   done | sort -n -k1,1 | tail -1 | cut -d" " -f2-)
          if [ -z "$newest" ]; then
            echo "::notice::registry/snapshots/ 不存在 —— 本轮没有快照可签，跳过 attestation。"
            echo "::notice::（没有快照的那几轮，制品资产也无从重建 —— 它们是按快照记录建的。）"
            exit 0
          fi
          echo "attestation 的 subject：$newest"
          node --no-warnings scripts/release/build-attestation.mjs \
            --snapshot "$newest" \
            --source-commit "$GITHUB_SHA" \
            --out predicate.json
          cosign attest-blob \
            --new-bundle-format \
            --rekor-url https://rekor.sigstore.dev \
            --predicate predicate.json \
            --type https://geoly.ai/skills-hub/release/v1 \
            --bundle attestation.sigstore.json \
            "$newest"
          # 🔴 再把 **cosign 真正写出来的那份 envelope** 解析一遍。
          #    build-attestation.mjs 的自检用的是我们自己拼的**占位** envelope，
          #    它证明不了 cosign 最后产出的东西也满足 §1.1 的契约与 E-2 的绑定。
          node --no-warnings scripts/release/check-attestation-bundle.mjs \
            --bundle attestation.sigstore.json \
            --expect-source-commit "$GITHUB_SHA"

          # 🔴 **再验一遍它的密码学部分 —— 上一行只做语义解析。**
          #
          #    2026-09-02 Codex 指出：attestation 的 gate 一直只解析 dsseEnvelope
          #    与语义字段，**从没验过 DSSE 签名、Fulcio 身份、Rekor 条目**。
          #    此前那些「自验」覆盖的是 messageSignature 形态的制品与快照 ——
          #    而 `src/sigstore.mjs` 显式拒绝 dsseEnvelope（那对安装路径是对的：
          #    messageSignature 的签名与我们手上的字节真的绑定）。
          #    结果就是：**我们自己发的 attestation，自己的工具从没验过它的签名。**
          #    对一个立论是「我们的工具能验我们签的东西」的项目，这说不过去。
          #
          # 🔴 那份脚本里最要紧的是**第 ④ 步**：DSSE 的签名只覆盖 envelope 自己，
          #    「签名验过了」**不等于**「它说的是我手上这个文件」——
          #    拿一个身份正确、签名有效的 DSSE bundle 配任意快照，密码学那层照样过。
          #    所以它还要把 subject 的摘要与**真实文件**的摘要绑上。
          node --no-warnings scripts/release/verify-attestation-signature.mjs \
            --bundle attestation.sigstore.json \
            --subject "$newest" \
            --expect-source-commit "$GITHUB_SHA"

      - name: 🔴 发布（dry_run 时跳过）
        if: ${{ inputs.dry_run == false && inputs.registry_only == false }}
        env:
          # npm trusted publishing：OIDC 换 token，仓库里**没有长期密钥**。
          # 前提是在 npmjs.com 上给这个包配好 trusted publisher（仓库 + workflow 文件名
          # + environment 名），配置本身是人在网页上做的，YAML 保证不了。
          #
          # ⚠️ 如果暂时还是走 NPM_TOKEN：把下一行取消注释，并在仓库 secrets 里加 NPM_TOKEN。
          #    provenance 仍然成立（它靠的是 id-token，不是 token 的种类），
          #    但那就多了一个长期凭据 —— 02-registry.md §8.2 明写「无长期 token」，
          #    所以这只应该是过渡态。
          # 2026-08-28 用户拍板：先走 NPM_TOKEN（与 social-ops-hub 同款），
          # 不等 trusted publisher 的网页配置。provenance 不受影响 —— 它靠 id-token。
          # ⚠️ 这是**过渡态**：02-registry.md §8.2 明写「无长期 token」，
          #    配好 trusted publisher 后要把这一行删掉。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          # 🔴 显式把**刚才签过的那一份 .tgz** 交给 publish，
          #    不让 npm 再打一次包（再打一次就不保证逐字节相同了）。
          npm publish "$TGZ" --provenance --access public

      - name: 回查 registry 真的在供这个版本
        if: ${{ inputs.dry_run == false && inputs.registry_only == false }}
        env:
          PKG_NAME: ${{ needs.guard.outputs.name }}
          PKG_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          node --no-warnings scripts/release/verify-registry.mjs \
            --name "$PKG_NAME" --version "$PKG_VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          if-no-files-found: error
          path: |
            *.tgz
            *.tgz.sigstore.json
            attestation.sigstore.json
            registry/snapshots/hub-*.json
            registry/snapshots/hub-*.sigstore.json
            dist/assets/*.tar.gz

  # ── ④ 离线引导用的资产（02-registry.md §8.2）───────────────────────────
  # 「不接受 npm 这个信任锚的使用者，从 GitHub Release 直接取 CLI tarball 与其 bundle，
  #   离线验签后本地安装。」—— 所以 tarball + bundle 必须挂到 Release 上。
  #
  # 🔴 这个 job 有 contents: write，但**没有 id-token**，也不跑测试、不跑 npm ci。
  #    它只做一件事：把上一个 job 已经签好、已经自验过的两个文件挂上去。
  release-assets:
    needs: [guard, publish]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle

      # 🔴 摘要复核：确认要挂上去的**就是**上一个 job 签过的那份字节。
      #    判据不该是「同一次 run 内传递的，应该没人动过」，而该是「摘要对得上」。
      #    这一步只用 sha256sum —— 不 checkout、不跑 node，
      #    因为这个 job 持有 contents: write，可执行代码面越小越好。
      # 🔴 制品资产也要复核摘要 —— 与上面那条同一个理由：
      #    判据不是「同一次 run 内传过来的，应该没人动过」，而是「摘要对得上」。
      #    早先只复核了 npm 的 .tgz，制品的 .tar.gz 是**下载完直接挂**的
      #    —— 那正是这个 job 的注释自己反对的做法。
      #    ⚠️ 仍然不跑 node（这个 job 有 contents: write，可执行面越小越好）：
      #    快照 JSON 就在同一份 bundle 里，用 jq + sha256sum 足够。
      - name: 复核制品资产的摘要
        env:
          WANT_N: ${{ needs.publish.outputs.snapshot_n }}
          WANT_SNAP_SHA: ${{ needs.publish.outputs.snapshot_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          snaps=()
          for f in registry/snapshots/hub-*.json; do
            [ "${f%.sigstore.json}" = "$f" ] && snaps+=("$f")
          done
          assets=(dist/assets/*.tar.gz)
          if [ ${#snaps[@]} -eq 0 ]; then
            # 没有快照就不该有制品资产 —— 有的话说明来路不明
            [ ${#assets[@]} -eq 0 ] || {
              echo "::error::没有快照，却有 ${#assets[@]} 个制品资产 —— 来路不明，拒绝挂载"; exit 1; }
            [ -z "$WANT_N" ] || {
              echo "::error::publish 说用了快照 $WANT_N，这里却一张都没有"; exit 1; }
            echo "::notice::本轮没有快照，也没有制品资产。"
            exit 0
          fi
          # 🔴🔴 **先复核快照本身。** 早先这里直接把「下载下来的快照」当摘要真值，
          #    于是把快照与资产**一起**换成自洽的一套，复核照样绿，最后分发出去的
          #    是一张与它 bundle 不匹配的快照（Codex 2026-08-31）。
          #    这个 job 的设计目标就是不信任跨 job 传递 —— 那就不能对快照破例。
          [ -n "$WANT_N" ] || { echo "::error::publish 没有输出 snapshot_n"; exit 1; }
          newest="registry/snapshots/hub-$WANT_N.json"
          test -f "$newest" || { echo "::error::拿不到 $newest"; exit 1; }
          got_snap=$(sha256sum "$newest" | cut -d' ' -f1)
          [ "$got_snap" = "$WANT_SNAP_SHA" ] || {
            echo "::error::$newest 摘要不符：想要 $WANT_SNAP_SHA，实际 $got_snap"; exit 1; }
          echo "按 $newest（摘要已复核）复核 ${#assets[@]} 个制品资产"

          # 快照记的每一个资产都必须在，且摘要对得上
          want_count=$(jq '.artifacts | length' "$newest")
          [ "${#assets[@]}" = "$want_count" ] || {
            echo "::error::快照记了 $want_count 个制品，却有 ${#assets[@]} 个资产文件"; exit 1; }
          jq -r '.artifacts[] | "\(.asset.sha256) \(.asset.file)"' "$newest" |
          while read -r want file; do
            [ -f "dist/assets/$file" ] || { echo "::error::缺资产 $file"; exit 1; }
            got="sha256:$(sha256sum "dist/assets/$file" | cut -d' ' -f1)"
            [ "$got" = "$want" ] || {
              echo "::error::$file 摘要不符：想要 $want，实际 $got"; exit 1; }
          done
          echo "::notice::✔ 全部制品资产的摘要与快照一致"

      - name: 复核摘要
        env:
          TGZ: ${{ needs.publish.outputs.tgz }}
          WANT: ${{ needs.publish.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -f "$TGZ" || { echo "::error::拿不到 $TGZ"; exit 1; }
          test -f "$TGZ.sigstore.json" || { echo "::error::拿不到 $TGZ.sigstore.json"; exit 1; }
          got=$(sha256sum "$TGZ" | cut -d" " -f1)
          if [ "$got" != "$WANT" ]; then
            echo "::error::摘要不符 —— 签的时候是 $WANT，现在是 $got"
            exit 1
          fi
          echo "✔ 摘要一致：$got"

      # ── ① CLI 自己的 Release：`v<x.y.z>` ────────────────────────────────
      - name: 建 CLI Release（npm 包 + bundle）
        # registry_only 不发 npm，也就没有「这个版本的 CLI Release」可建。
        if: ${{ inputs.registry_only == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.guard.outputs.version }}
          TGZ: ${{ needs.publish.outputs.tgz }}
        run: |
          set -euo pipefail
          # 🔴 **不用 glob**。glob 会把目录里任何多出来的 .tgz 一并发出去，
          #    而「多出来一个 .tgz」正是出问题时最可能的形态。
          assets=("$TGZ" "$TGZ.sigstore.json")
          [ -f attestation.sigstore.json ] && assets+=(attestation.sigstore.json)
          printf 'CLI Release 资产：%s\n' "${assets[@]}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "npm 包与其 Sigstore bundle（离线验签路径见 README / 02-registry.md §8.2）。

          ⚠️ **registry 的分发物不在这里** —— 快照与制品资产在 \`hub-v<N>\` Release 上
          （02-registry.md §4.0 的 locator 契约）。两者刻意分开：合在一起的话
          客户端就无法从「快照号 N」推出下载地址。" \
            "${assets[@]}"

      # ── ② registry 的 Release：`hub-v<N>` ────────────────────────────────
      #
      # 🔴 **必须与 CLI 的 `v<x.y.z>` 分开**（02-registry.md §4.0）。
      #    客户端手上只有已验签快照里的 `asset.file` 与 `sha256`，位置靠
      #    `hub-v<N>` 这个约定推导。合并到 CLI 版本号上的话，`<N> → tag` 这个
      #    映射**不在任何签名对象里**，客户端推不出去哪儿下载。
      #    📌 2026-09-03 之前的实现正是合并的，结果是「已发布但没人能装」。
      - name: 建 registry Release hub-v<N>（快照 + 资产）
        # 🔴 **不带 registry_only 条件** —— 这一步在两种模式下都要跑，
        #    它就是 registry_only 存在的理由。
        if: ${{ needs.publish.outputs.snapshot_n != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ needs.publish.outputs.snapshot_n }}
        run: |
          set -euo pipefail
          snap="registry/snapshots/hub-$N.json"
          # 🔴 **有快照没 bundle 就直接失败。** 挂一张验不了签的快照上去，
          #    比不挂更糟：它看起来是可用的分发物。
          if [ ! -f "$snap" ]; then
            echo "::error::publish 报告了快照 $N，但 $snap 不在 —— 产物与声明对不上"
            exit 1
          fi
          if [ ! -f "$snap.sigstore.json" ]; then
            echo "::error::$snap 没有对应的 .sigstore.json —— 拒绝挂载一张验不了签的快照"
            exit 1
          fi
          assets=("$snap" "$snap.sigstore.json")
          # 这些 .tar.gz 是上一步按快照**重建并逐字节比对**过的（§1 阶段 C）。
          shopt -s nullglob
          for f in dist/assets/*.tar.gz; do assets+=("$f"); done
          # 🔴 快照里有制品，就必须有对应的资产 —— 否则客户端按 locator 取到 404，
          #    而那时它手上的快照是验过签的，会以为是分发被人动了手脚。
          want=$(node -p "JSON.parse(require('fs').readFileSync('$snap','utf8')).artifacts.length")
          got=$(ls dist/assets/*.tar.gz 2>/dev/null | wc -l | tr -d ' ')
          if [ "$want" != "$got" ]; then
            echo "::error::快照 $N 记了 $want 个制品，但只重建出 $got 个资产 —— 拒绝发一个取不全的 Release"
            exit 1
          fi
          printf 'hub-v%s 资产：%s\n' "$N" "${assets[@]}"
          gh release create "hub-v$N" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "hub-v$N" \
            --notes "registry 快照 $N 与它记录的全部制品资产。

          客户端按 02-registry.md §4.0 的 locator 从**已验签的**快照推导下载地址：
          \`/releases/download/hub-v$N/<asset.file>\`。

          ⚠️ 资产不单独挂 Sigstore bundle —— 它们的 sha256 已经被这张**已签名的
          快照**钉死。需要 bundle 的是信任链的锚点（快照与 timestamp）。" \
            "${assets[@]}"
