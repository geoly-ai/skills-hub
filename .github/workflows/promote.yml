name: Promote

# ══════════════════════════════════════════════════════════════════════════
# 06-submission.md §3（promote 不是自动发布）、§5（权限边界）。
#
# 🔴 **只产出一张 promotion PR，不直接写 main。** 阶段 A 的全部产物
#    （制品文件、资产字节、快照 JSON 含 created_at）都在那张 PR 里，
#    **全部可被人复算** —— `validate-pr.yml` 的 promotion-gates 就是复算它。
#
# 🔴 **绝不 checkout fork。** 这个 workflow 有 `contents: write`；
#    它读的只有「已经合并到 main 的内容」（§5）。
#
# ── 🔴 为什么合并了还要重新验证一遍（§3）────────────────────────────────
# 「已 merge」这个事实本身不够。分支保护可以配 stale-approval dismissal，
# 但那是**仓库设置**，不是我们能证明的东西 —— 设置被改、或某次绕过，都会让一个
# 「approve 之后又推了一版」的 PR 带着旧审批走到这里。§3 要求四项：
#   1. approve 挂在被合并的 head SHA 上          → verify-merged-pr.mjs
#   2. 变更路径只有 submissions/**               → pr-classify.mjs（在 facts 那一步，
#                                                   与「这是不是 promotion PR」同一次调用）
#   3. 载荷重跑一遍全部结构门                     → submission/run-gates.mjs
#   4. 版本号从未被使用过（含已 yank）            → stage-submissions.mjs（判盘上的目录）
#
# ⚠️ **审批人数的分级门不在这里**：capability tier 要读载荷里的 manifest 才知道，
#    由 `build-inputs.mjs` 的 `assertApprovalsSatisfyTier` 判（它同时是写进
#    `review.capability_tier` 的那一处，两者共用一个来源就不会分叉）。
#    这里只判「至少 1 条有效 approve」这个下限。
# ══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    paths: ['submissions/**']

permissions:
  contents: write
  pull-requests: write

env:
  # 🔴 与 validate-pr.yml 里那个是**同一个占位**：真的 bot 账号还不存在（R-20）。
  #    判据是不可变 node id，不是 login —— login 可改名、也可被别人重新认领。
  RELEASE_BOT_ID: "PLACEHOLDER_RELEASE_BOT_NODE_ID"

# 🔴 **串行，且不许取消。** 两张 promotion PR 从同一基线各自判过「版本号没占用」，
#    并发就会双双通过（verify-merged-pr.mjs 里记的那个 TOCTOU）。
#    `cancel-in-progress: false` —— 取消一个跑到一半的 promote 会留下半棵树。
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - run: npm ci --ignore-scripts

      # ── 取被合并的那张投稿 PR 的事实 ────────────────────────────────────
      - name: 取 PR 事实（GitHub API）
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 🔴 **恰好一张**。一个 push 关联到 0 张（直推）或多张（同时合并）
          #    都说明前提不成立 —— 那时「这批投稿是谁审的」没有唯一答案。
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" > pulls.json
          n=$(jq 'length' pulls.json)
          if [ "$n" != "1" ]; then
            echo "::error::这个 push 关联到 $n 张 PR，必须恰好 1 张。"
            echo "::error::  0 张 = 有人直推 main（分支保护该拦住）；>1 张 = 无法确定审批归属。"
            exit 1
          fi
          ref=$(jq -r '.[0].head.ref' pulls.json)
          headrepo=$(jq -r '.[0].head.repo.full_name' pulls.json)
          author=$(jq -r '.[0].user.node_id' pulls.json)
          authorlogin=$(jq -r '.[0].user.login' pulls.json)
          basesha=$(jq -r '.[0].base.sha' pulls.json)
          headsha=$(jq -r '.[0].head.sha' pulls.json)

          # 🔴🔴 **promotion PR 合并会再触发这个 workflow。** 它删掉
          #    `submissions/**`，而删除同样匹配 `paths:` 过滤器（Codex 2026-08-31）。
          #    不短路的话，第二次运行会带着 artifacts/ 与 registry/ 的改动去撞
          #    §3 第 2 项的路径白名单，表现为一次莫名其妙的失败。
          #
          # 🔴 **判据直接用 router 那一份代码**，不在这里用 shell 复述。
          #    自己写一遍 `case promotion/hub-*` 的话：`promotion/hub-x`、
          #    `promotion/hub-1/foo` 都会匹配，而且**漏掉作者必须是 release bot**
          #    这一条 —— 仓库协作者开一个叫 promotion/hub-9 的普通投稿 PR，
          #    validate-pr 按 submission 放行、合并后却被这里跳过，
          #    留下积压并堵住后面所有 promote（Codex 2026-08-31）。
          #    ⚠️ classifyPr 的三元判据是「严格分支号 + 本仓库 + bot node id」。
          #
          #    这一步同时完成 §3 第 2 项（变更路径白名单）—— assertPathsAllowed
          #    就在 pr-classify 的 CLI 里，判定与路径检查本来就是一件事。
          paths=$(git diff --no-renames --name-only "$basesha...$headsha")
          kind=$(node --no-warnings scripts/submission/pr-classify.mjs \
            --head-ref "$ref" --head-repo "$headrepo" --this-repo "$GITHUB_REPOSITORY" \
            --author-id "$author" --author "$authorlogin" \
            --release-bot-id "$RELEASE_BOT_ID" --changed-paths "$paths")
          if [ "$kind" = "promotion" ]; then
            echo "::notice::这是 promotion PR（$ref）自己合并触发的，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 🔴 **「关联到一张 PR」不等于「那张 PR 合并进了 main」**（Codex 2026-08-31）：
          #    cherry-pick 过来的 commit、或一次绕过保护的直推，都能关联上一张
          #    从未合并的 PR，于是「这批投稿是谁审的」会被错误归属。
          merged=$(jq -r '.[0].merged_at // "null"' pulls.json)
          baseref=$(jq -r '.[0].base.ref' pulls.json)
          if [ "$merged" = "null" ] || [ "$baseref" != "main" ]; then
            echo "::error::关联到的 #$(jq -r '.[0].number' pulls.json) 并没有合并进 main"
            echo "::error::  merged_at=$merged base.ref=$baseref"
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr=$(jq -r '.[0].number'        pulls.json)" >> "$GITHUB_OUTPUT"
          # 🔴 head.sha，**不是** merge_commit_sha：squash/rebase 会生成新 commit，
          #    而 review 的 commit_id 挂在原 head 上（verify-merged-pr.mjs 里那条）。
          echo "head=$(jq -r '.[0].head.sha'    pulls.json)" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r '.[0].base.sha'    pulls.json)" >> "$GITHUB_OUTPUT"
          echo "head_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "head_repo=$(jq -r '.[0].head.repo.full_name' pulls.json)" >> "$GITHUB_OUTPUT"
          # 🔴 作者用不可变 node id，不是 login
          echo "author=$(jq -r '.[0].user.node_id' pulls.json)" >> "$GITHUB_OUTPUT"
          echo "author_login=$(jq -r '.[0].user.login' pulls.json)" >> "$GITHUB_OUTPUT"
          # vendored 的 imported_at 用**投稿 PR 的创建时刻** —— 那是「什么时候
          # 搬进来的」这件事唯一有据可查的时间点，比 promote 跑起来的时刻更准。
          echo "created_at=$(jq -r '.[0].created_at' pulls.json)" >> "$GITHUB_OUTPUT"

      - name: §3 第 1 项 —— approve 未失效
        id: approvals
        if: ${{ steps.facts.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.facts.outputs.pr }}
          HEAD: ${{ steps.facts.outputs.head }}
          AUTHOR: ${{ steps.facts.outputs.author }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            | jq -s 'add | map({
                userId: .user.node_id, userLogin: .user.login,
                state: .state, commitId: .commit_id, submittedAt: .submitted_at
              })' > reviews.json
          # 🔴 名单为空时 verify-merged-pr.mjs 会直接拒 —— fail-closed 是故意的：
          #    不限定的话，一个 dependabot[bot] 的 APPROVED 就能满足审批门。
          ids=$(jq -r '.maintainers | map(.id) | join(",")' registry/maintainers.json)
          approvers=$(node --no-warnings scripts/promote/verify-merged-pr.mjs \
            --reviews reviews.json --pr-head-sha "$HEAD" \
            --maintainer-ids "$ids" --needed 1 --author-id "$AUTHOR")
          echo "approvers=$approvers" >> "$GITHUB_OUTPUT"

      - name: §3 第 3 项 —— 结构门全部重跑
        if: ${{ steps.facts.outputs.skip == 'false' }}
        run: |
          set -euo pipefail
          # 🔴 与投稿 PR 上跑的是**同一份**代码、同一份 reserved.json ——
          #    另写一份「promote 侧的结构门」就是给自己造两个真值。
          node --no-warnings scripts/submission/run-gates.mjs \
            --submissions submissions --artifacts artifacts \
            --reserved registry/reserved.json --owners registry/owners.json
          # §8 第 5 条那道门也重跑 —— 与投稿 PR 上是同一份代码
          node --no-warnings scripts/submission/scan-text.mjs --submissions submissions

      # 🔴 **必须在搬运之前** —— stage-submissions 会把 submissions/ 搬空。
      - name: 收集 PROMOTION.json（首次注册的 owner、pack 的 provenance）
        id: promo
        if: ${{ steps.facts.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.facts.outputs.pr }}
          AUTHOR: ${{ steps.facts.outputs.author }}
          AUTHOR_LOGIN: ${{ steps.facts.outputs.author_login }}
          CREATED: ${{ steps.facts.outputs.created_at }}
        run: |
          set -euo pipefail
          # 🔴 `kind: org` 的绑定要记**组织自己**的 node id，不是投稿者的 ——
          #    记成投稿者的，等于把 namespace 给了这个人却显示成组织的。
          #    先把本批声明过的 org login 解析成 node id。
          #    ⚠️「这个人是不是该组织的成员」**没有自动判据**，归 §8 人工门。
          orgs=$(grep -ho '"login"[[:space:]]*:[[:space:]]*"[^"]*"' \
                   $(find submissions -name PROMOTION.json) 2>/dev/null \
                 | sed 's/.*"\([^"]*\)"$/\1/' | sort -u || true)
          echo '{}' > /tmp/org-ids.json
          for login in $orgs; do
            if id=$(gh api "orgs/$login" --jq .node_id 2>/dev/null); then
              jq --arg k "$login" --arg v "$id" '. + {($k): $v}' /tmp/org-ids.json > /tmp/o.json
              mv /tmp/o.json /tmp/org-ids.json
            fi
          done

          node --no-warnings scripts/promote/collect-promotion-inputs.mjs \
            --submissions submissions --owners registry/owners.json \
            --pr "$PR" --author-id "$AUTHOR" --author-login "$AUTHOR_LOGIN" \
            --created-at "$CREATED" --org-ids /tmp/org-ids.json \
            --claim-owner-out /tmp/claim-owner.json \
            --provenance-out /tmp/provenance.json \
            --owners-out registry/owners.json >> "$GITHUB_OUTPUT"

      # ── 阶段 A：搬运 → inputs → 快照 ──────────────────────────────────
      - name: §3 第 4 项 + 搬进 artifacts/
        id: stage
        if: ${{ steps.facts.outputs.skip == 'false' }}
        env:
          BASE: ${{ steps.facts.outputs.base }}
          HEAD: ${{ steps.facts.outputs.head }}
        run: |
          set -euo pipefail
          # 🔴 **只搬这一次 PR 带来的那几个。** 触发条件是「push 到 main 且动了
          #    submissions/」，但 submissions/ 是整个目录 —— 上一次 promote 没跑完
          #    留下的积压会被这一次一并搬走，并在 build-inputs 那里被标成
          #    「本次 PR 审过的」。复算门对新增 review 是自举的，抓不到这种错误归属。
          # 🔴 `--diff-filter=d` 排掉**删除**：一张同时删掉别的投稿的 PR，
          #    删掉的那个会进 want 名单，然后与盘上的实际内容对不上，
          #    报成「少了 X」—— 而真相是它本来就该没有。
          only=$(git diff --no-renames --diff-filter=d --name-only "$BASE...$HEAD" \
            | sed -n 's|^submissions/\([^/]*\)/\([^/]*\)/.*$|\1/\2|p' \
            | sort -u | paste -sd, -)
          if [ -z "$only" ]; then
            echo "::error::这次 push 没有动 submissions/ 下的任何投稿目录 —— 触发条件与内容对不上。"
            exit 1
          fi
          echo "::notice::本次 PR 带来的投稿：$only"
          # 版本号是否仍然空着，判据是**盘上真实的目录**（stage-submissions 里 ①）
          ids=$(node --no-warnings scripts/promote/stage-submissions.mjs --only "$only")
          echo "new_ids=$ids" >> "$GITHUB_OUTPUT"

      - name: 算 promotion inputs（owner / review / provenance）
        if: ${{ steps.facts.outputs.skip == 'false' }}
        env:
          PR: ${{ steps.facts.outputs.pr }}
          HEAD: ${{ steps.facts.outputs.head }}
          AUTHOR: ${{ steps.facts.outputs.author }}
          APPROVERS: ${{ steps.approvals.outputs.approvers }}
          NEW_IDS: ${{ steps.stage.outputs.new_ids }}
        run: |
          set -euo pipefail
          # 🔴 把「没有快照」和「命令失败」分开：一个 `|| true` 会把读目录、
          #    grep、sort 的异常一起吞掉，然后**按创世处理** —— 那会绕开不可变门。
          if [ -d registry/snapshots ]; then
            prev=$(ls registry/snapshots | { grep -E '^hub-(0|[1-9][0-9]*)\.json$' || test $? = 1; } \
              | sed 's/[^0-9]//g' | sort -n | tail -1)
          else
            prev=""
          fi
          # 两份「PR 侧的事实」来自投稿目录里的 PROMOTION.json（决策 ②，R-19 已闭合）：
          #   · `--claim-owner`   ← 首次注册 namespace 的 owner（按 namespace 索引）
          #   · `--provenance-of` ← pack 的 provenance
          # 🔴 仍然不在这里编默认值：owner 与 provenance 是**签进快照**的，
          #    编错了事后改不动。缺了就让它失败。
          # capability tier 的审批人数门在这一步里判（见文件头的说明）
          node --no-warnings scripts/promote/build-inputs.mjs \
            --artifacts artifacts --new-ids "$NEW_IDS" \
            --pr "$PR" --head-sha "$HEAD" --approved-by "$APPROVERS" --author "$AUTHOR" \
            --owners registry/owners.json \
            ${prev:+--previous-snapshot "registry/snapshots/hub-$prev.json"} \
            --claim-owner /tmp/claim-owner.json \
            --provenance-of /tmp/provenance.json \
            --out /tmp/inputs.json
          echo "PREV=${prev:-}" >> "$GITHUB_ENV"

      - name: 建快照（阶段 A 的最后一步）
        id: snapshot
        if: ${{ steps.facts.outputs.skip == 'false' }}
        run: |
          set -euo pipefail
          # 🔴 创世时 N=0；否则 N = 上一张 + 1。
          #    编号必须连续 —— validate-promotion 会再判一次（E_SNAPSHOT_JUMP）。
          if [ -z "${PREV:-}" ]; then n=0; else n=$((PREV + 1)); fi
          mkdir -p registry/snapshots
          # 🔴 `created_at` 在**这里**定死并写进快照（§2 阶段 A）。
          #    它必须写进 promotion PR 的描述，由人比对 —— 复算门覆盖不了它。
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node --no-warnings scripts/build-snapshot.mjs \
            --artifacts artifacts --inputs /tmp/inputs.json \
            --snapshot "$n" ${PREV:+--previous "$PREV"} \
            --created-at "$created" --repo "$GITHUB_REPOSITORY" \
            --out "registry/snapshots/hub-$n.json"
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      # ── 自检：把 validate-promotion 会跑的那道门先在本地跑一遍 ──────────
      - name: 自检（开 PR 之前先自己过一遍复算门）
        if: ${{ steps.facts.outputs.skip == 'false' }}
        run: |
          set -euo pipefail
          # 🔴 开一张注定被自己的门拒掉的 PR，只会让维护者去查 CI 而不是查这里。
          #    `--base` 指向 push 之前的那棵树。
          # 🔴 唯一目录 + trap：失败路径也要清干净，否则重跑时 `worktree add` 会
          #    因目录已存在而失败（Codex 2026-08-31）。
          base="$RUNNER_TEMP/promote-base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'git worktree remove --force "$base" 2>/dev/null || true' EXIT
          # ⚠️ `github.event.before` 在「main 刚被创建」时是全零、force-push 之后
          #    可能已不可达 —— 两种都不该静默按创世处理，直接报错让人来看。
          before='${{ github.event.before }}'
          if ! git rev-parse --verify --quiet "$before^{commit}" >/dev/null; then
            echo "::error::拿不到 push 之前的 commit（$before）—— 无法自检，请人工复核。"
            exit 1
          fi
          # 🔴 「对象还在」≠「它是当前 HEAD 的祖先」（Codex 2026-08-31）：
          #    force-push 之后旧 commit 可能仍被 tag 或别的分支引用，
          #    `rev-parse --verify` 照样成功 —— 于是自检会拿一条**无关的基线**
          #    去比，得出一个毫无意义的「通过」。
          if ! git merge-base --is-ancestor "$before" "$GITHUB_SHA"; then
            echo "::error::$before 不是 $GITHUB_SHA 的祖先（force-push?）—— 基线不可信，请人工复核。"
            exit 1
          fi
          git worktree add "$base" "$before"
          node --no-warnings scripts/promote/verify-promotion.mjs --pr . --base "$base"

      - name: 开 promotion PR（**不直推 main**）
        if: ${{ steps.facts.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.snapshot.outputs.n }}
          CREATED: ${{ steps.snapshot.outputs.created }}
          PR: ${{ steps.facts.outputs.pr }}
          NEW_IDS: ${{ steps.stage.outputs.new_ids }}
          APPROVERS: ${{ steps.approvals.outputs.approvers }}
        run: |
          set -euo pipefail
          # 🔴 分支名形如 `promotion/hub-<N>` —— router 认的就是它 + 作者身份（§4）
          branch="promotion/hub-$N"
          git config user.name  "geoly-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          # 🔴 远端已有同名分支 = 上一次跑到一半留下的残骸（push 成功但
          #    gh pr create 失败，或 PR 被关掉）。**不静默复用**：那会把这一次的
          #    结果推到一段来历不明的历史上（Codex 2026-08-31）。
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::远端已存在 $branch —— 上一次 promote 留下的残骸。"
            echo "::error::  请先确认它对应的 PR 状态，删掉分支后重跑。"
            exit 1
          fi
          git checkout -b "$branch"
          # 🔴 `registry/owners.json` 也要提交 —— 首次注册**必须落表**，
          #    不落的话下一次同 namespace 的投稿会走「尚未注册」那条路，
          #    可以被**另一个人**认领（05-lifecycle §1 的绑定就形同虚设）。
          git add artifacts registry/snapshots registry/owners.json submissions
          git commit -m "promote: 快照 $N（来自 #$PR）"
          git push origin "$branch"
          # push 之后到 PR 创建之间失败的话，分支会留在远端 —— 上面那道门就是
          # 为了让下一次跑**明确报出来**，而不是接着往上堆。
          # 🔴 §2.2 要求 created_at 写进描述，由**人**比对 ——
          #    它是复算的输入之一，而复算是拿它当既定事实的，覆盖不了它自己。
          gh pr create --base main --head "$branch" \
            --title "promote: 快照 $N（来自 #$PR）" \
            --body "$(printf '%s\n' \
              "自动生成的 promotion PR —— 阶段 A 的全部产物都在这里，**可被人复算**。" \
              "" \
              "| 字段 | 值 |" \
              "| --- | --- |" \
              "| 快照 | \`hub-$N.json\` |" \
              "| \`created_at\` | \`$CREATED\` |" \
              "| 来源投稿 PR | #$PR |" \
              "| 本次新增 | $NEW_IDS |" \
              "| 有效 approve | $APPROVERS |" \
              "" \
              "🔴 **\`created_at\` 请人工比对**：它是确定性复算的**输入**，" \
              "复算是拿它当既定事实的，因此覆盖不了它自己（06-submission §2.2）。" \
              "" \
              "复算与不可变门由 \`validate-pr.yml\` 的 \`promotion-gates\` 跑。")"
